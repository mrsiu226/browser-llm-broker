services:
  broker:
    build:
      context: ..
      dockerfile: broker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - broker-data:/data
    expose:
      - "8080"

  caddy:                      # automatic HTTPS; remove this service if you already have a reverse proxy
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - broker

volumes:
  broker-data:
  caddy-data:
  caddy-config:
